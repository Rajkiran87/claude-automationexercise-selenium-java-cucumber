# ------------------------------------------------------------------
# Test configuration.
# Any value can be overridden from the command line, for example:
#   mvn test -Dbrowser=firefox -Dheadless=true
# ------------------------------------------------------------------

# Website under test
baseUrl=https://automationexercise.com

# Browser to use: chrome | firefox | edge
browser=chrome

# true = run without opening a visible browser window (used in CI)
headless=false

# Maximum seconds to wait for an element before failing
timeoutSeconds=15
