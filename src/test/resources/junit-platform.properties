# Cucumber settings used by the JUnit Platform (Maven Surefire)

# pretty = readable console output, html/json = reports in target/cucumber-reports
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber-report.html, json:target/cucumber-reports/cucumber.json

# Do not print the "publish your report" banner
cucumber.publish.quiet=true

# Suggest missing step methods in camelCase
cucumber.snippet-type=camelcase
